<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleb Kim — Engineering Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000}
#pdf{width:100%}
.page{position:relative;width:100%;line-height:0}
.page canvas{width:100%;height:auto;display:block}
.page a.lnk{position:absolute;display:block}
#status{padding:40px;text-align:center;color:#888;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
#status a{color:#C9A227}
</style>
</head>
<body>

<div id="pdf"></div>
<div id="status">Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const FILE = 'Portfolio.pdf';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const container = document.getElementById('pdf');
const status = document.getElementById('status');
const pageEls = [];
let pdfDoc = null;

async function renderAll(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = container.clientWidth;
  container.innerHTML = '';
  pageEls.length = 0;

  for (let n = 1; n <= pdfDoc.numPages; n++){
    const page = await pdfDoc.getPage(n);
    const base = page.getViewport({scale: 1});
    const scale = width / base.width;
    const vp = page.getViewport({scale: scale});

    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.style.height = vp.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    wrap.appendChild(canvas);
    container.appendChild(wrap);
    pageEls[n] = wrap;

    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: page.getViewport({scale: scale * dpr})
    }).promise;

    const anns = await page.getAnnotations();
    for (const a of anns){
      if (a.subtype !== 'Link') continue;
      const r = vp.convertToViewportRectangle(a.rect);
      const el = document.createElement('a');
      el.className = 'lnk';
      el.style.left = Math.min(r[0], r[2]) + 'px';
      el.style.top = Math.min(r[1], r[3]) + 'px';
      el.style.width = Math.abs(r[2] - r[0]) + 'px';
      el.style.height = Math.abs(r[3] - r[1]) + 'px';
      if (a.url){
        el.href = a.url; el.target = '_blank'; el.rel = 'noopener';
      } else if (a.dest){
        el.href = '#';
        el.addEventListener('click', async ev => {
          ev.preventDefault();
          try{
            const d = typeof a.dest === 'string'
              ? await pdfDoc.getDestination(a.dest) : a.dest;
            const idx = await pdfDoc.getPageIndex(d[0]);
            pageEls[idx + 1].scrollIntoView({behavior:'smooth', block:'start'});
          }catch(e){}
        });
      }
      wrap.appendChild(el);
    }
  }
}

pdfjsLib.getDocument(FILE).promise.then(async doc => {
  pdfDoc = doc;
  status.style.display = 'none';
  await renderAll();
}).catch(() => {
  status.innerHTML = 'Could not load. <a href="' + FILE + '">Open the PDF</a>.';
});

let t;
window.addEventListener('resize', () => {
  if (!pdfDoc) return;
  clearTimeout(t);
  t = setTimeout(renderAll, 300);
});
</script>

</body>
</html>
